[versions]
agp = "8.13.0"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.4"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.09.00"
# Material 3 1.4: hojas inferiores sin gesto de arrastre (sheetGesturesEnabled)
material3 = "1.4.0"
navigation = "2.9.5"
room = "2.8.1"
datastore = "1.1.7"
retrofit = "3.0.0"
okhttp = "4.12.0"
serialization = "1.9.0"
